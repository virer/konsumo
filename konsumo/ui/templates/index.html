<!DOCTYPE html>
<html>
<head>
  <title>Konsumo Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart.js"></script>
</head>
<body>
  <h1>Konsumo - Home Consumption</h1>


  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('electricity')">Electricity</div>
    <div class="tab" onclick="switchTab('water')">Water</div>
    <div class="tab" onclick="switchTab('fuel')">Fuel</div>
    <div class="tab" onclick="switchTab('form')">+ Add Entry</div>
  </div>
  
  <div id="tab-electricity" class="tab-content active">
    <h2>Electricity Usage</h2>
    <canvas id="electricityChart"></canvas>
    <div id="electricityLatest" class="panel"></div>
    <div id="electricityHeatingProjection" class="panel panel--highlight"></div>
  </div>
  
  <div id="tab-water" class="tab-content">
    <h2>Water Usage</h2>
    <canvas id="waterChart"></canvas>
    <div id="waterLatest" class="panel"></div>
    <div id="waterYearSummary" class="panel panel--highlight"></div>
  </div>
  
  <div id="tab-fuel" class="tab-content">
    <h2>Fuel Usage</h2>
    <canvas id="fuelChart"></canvas>
    <div id="fuelLatest" class="panel"></div>
    <div id="fuelHeatingProjection" class="panel panel--highlight"></div>
  </div>
  
  <div id="tab-form" class="tab-content">
    <h2>Add New Entry</h2>
    <form method="POST" action="/submit">
      <label>Date:</label>
      <input type="date" name="date" id="dateInput" required><br>

      <label>Category:</label>
      <select name="category" id="categorySelect" required onchange="onCategoryChange()">
        <option value="">-- Select --</option>
        <option value="water">Water</option>
        <option value="electricity">Electricity</option>
        <option value="fuel">Fuel</option>
      </select><br>

      <div id="waterFields" style="display: none;">
        Water (m³): <input type="number" step="0.01" name="water" id="waterInput"><br>
        <div id="waterLatestEntry" class="hint-box" style="display: none;"></div>
      </div>

      <div id="electricityFields" style="display: none;">
        Electricity Day (kWh): <input type="number" step="0.01" name="electricity_day" id="electricityDayInput"><br>
        Electricity Night (kWh): <input type="number" step="0.01" name="electricity_night" id="electricityNightInput"><br>
        <div id="electricityLatestEntry" class="hint-box" style="display: none;"></div>
      </div>

      <div id="fuelFields" style="display: none;">
        Gasoline (L): <input type="number" step="0.01" name="gasoline" id="gasolineInput"><br>
        <div id="fuelLatestEntry" class="hint-box" style="display: none;"></div>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div class="form-section">
      <h3>Last 10 Recorded Values</h3>
      <div id="last10Entries" style="margin-top: 15px;"></div>
    </div>
  </div>


  <script>
    // Auto-fill today and restore form state from URL
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("dateInput").value = today;
      
      // Check URL parameters for tab and category
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get("tab");
      const category = urlParams.get("category");
      
      // Set category value first if present
      if (category) {
        const categorySelect = document.getElementById("categorySelect");
        categorySelect.value = category;
        onCategoryChange(); // Trigger to show latest entry
      }
      
      if (tab === "form") {
        switchTab("form");
      }
    });
  
    function onCategoryChange() {
      const category = document.getElementById("categorySelect").value;
      document.getElementById("waterFields").style.display = (category === "water") ? "block" : "none";
      document.getElementById("electricityFields").style.display = (category === "electricity") ? "block" : "none";
      document.getElementById("fuelFields").style.display = (category === "fuel") ? "block" : "none";
      
      // Show latest entry for selected category
      if (category && chartData.latest_entry && chartData.latest_entry[category]) {
        const latestEntry = chartData.latest_entry[category];
        const dateStr = formatDate(latestEntry.date);
        let html = '<strong>Latest Entry:</strong> ';
        
        if (category === "water") {
          html += `Date: ${dateStr}, Water: ${formatNumber(latestEntry.water)} m³`;
          document.getElementById("waterLatestEntry").innerHTML = html;
          document.getElementById("waterLatestEntry").style.display = "block";
          document.getElementById("electricityLatestEntry").style.display = "none";
          document.getElementById("fuelLatestEntry").style.display = "none";
        } else if (category === "electricity") {
          html += `Date: ${dateStr}, Day: ${formatNumber(latestEntry.electricity_day)} kWh, Night: ${formatNumber(latestEntry.electricity_night)} kWh`;
          document.getElementById("electricityLatestEntry").innerHTML = html;
          document.getElementById("electricityLatestEntry").style.display = "block";
          document.getElementById("waterLatestEntry").style.display = "none";
          document.getElementById("fuelLatestEntry").style.display = "none";
        } else if (category === "fuel") {
          html += `Date: ${dateStr}, Gasoline: ${formatNumber(latestEntry.gasoline)} L`;
          document.getElementById("fuelLatestEntry").innerHTML = html;
          document.getElementById("fuelLatestEntry").style.display = "block";
          document.getElementById("waterLatestEntry").style.display = "none";
          document.getElementById("electricityLatestEntry").style.display = "none";
        }
      } else {
        // Hide all latest entry displays
        document.getElementById("waterLatestEntry").style.display = "none";
        document.getElementById("electricityLatestEntry").style.display = "none";
        document.getElementById("fuelLatestEntry").style.display = "none";
      }
    }
  
    // Tab switching logic
    function switchTab(tabName) {
      const contents = document.querySelectorAll(".tab-content");
      const tabs = document.querySelectorAll(".tab");
      contents.forEach(c => c.classList.remove("active"));
      tabs.forEach(t => t.classList.remove("active"));
      
      document.getElementById("tab-" + tabName).classList.add("active");
      tabs.forEach(tab => {
        if (tab.textContent.toLowerCase().includes(tabName)) {
          tab.classList.add("active");
        }
      });
      
      // If switching to form tab, ensure category fields are shown if category is selected
      if (tabName === "form") {
        const categorySelect = document.getElementById("categorySelect");
        if (categorySelect && categorySelect.value) {
          onCategoryChange();
        }
      }
    }
  
    // Get pre-aggregated data from backend
    const chartData = {{ marshal . }};
    const entries = chartData.entries || [];

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function formatNumber(num) {
      return num.toFixed(2);
    }
    
    // Month names for labels
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    
    // Color palette for different years
    const yearColors = [
      "rgb(255, 99, 132)",   // red
      "rgb(54, 162, 235)",   // blue
      "rgb(255, 206, 86)",   // yellow
      "rgb(75, 192, 192)",   // teal
      "rgb(153, 102, 255)",  // purple
      "rgb(255, 159, 64)",   // orange
      "rgb(199, 199, 199)",  // grey
      "rgb(83, 102, 255)",   // indigo
      "rgb(255, 99, 255)",   // pink
      "rgb(99, 255, 132)"    // green
    ];

    function isDarkMode() {
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function getChartColors() {
      const dark = isDarkMode();
      const style = getComputedStyle(document.documentElement);
      return {
        text: style.getPropertyValue("--chart-text").trim() || (dark ? "#aaaaaa" : "#666666"),
        grid: style.getPropertyValue("--chart-grid").trim() || (dark ? "#444444" : "#dddddd"),
      };
    }

    function createChartOptions(yLabel) {
      const colors = getChartColors();
      return {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 2,
        plugins: {
          legend: {
            labels: { color: colors.text },
          },
          tooltip: {
            titleColor: colors.text,
            bodyColor: colors.text,
          },
        },
        scales: {
          x: {
            type: "linear",
            position: "bottom",
            title: {
              display: true,
              text: "Month",
              color: colors.text,
            },
            min: 1,
            max: 12,
            ticks: {
              stepSize: 1,
              color: colors.text,
              callback: function(value) {
                const month = Math.round(value);
                if (month >= 1 && month <= 12) {
                  return monthNames[month - 1];
                }
                return "";
              },
            },
            grid: { color: colors.grid },
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: yLabel,
              color: colors.text,
            },
            ticks: { color: colors.text },
            grid: { color: colors.grid },
          },
        },
      };
    }

    const chartInstances = [];

    function updateChartThemes() {
      const colors = getChartColors();
      chartInstances.forEach((chart) => {
        if (!chart || !chart.options) return;
        chart.options.plugins.legend.labels.color = colors.text;
        chart.options.plugins.tooltip.titleColor = colors.text;
        chart.options.plugins.tooltip.bodyColor = colors.text;
        ["x", "y"].forEach((axis) => {
          if (chart.options.scales[axis]) {
            chart.options.scales[axis].ticks.color = colors.text;
            chart.options.scales[axis].grid.color = colors.grid;
            if (chart.options.scales[axis].title) {
              chart.options.scales[axis].title.color = colors.text;
            }
          }
        });
        chart.update();
      });
    }

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateChartThemes);
  
    // Helper function to create chart datasets from aggregated data
    function createDatasets(dataByYear, colorIndex) {
      const years = Object.keys(dataByYear).sort();
      return years.map((year, idx) => {
        const yearData = dataByYear[year] || [];
        return {
          label: year,
          data: yearData.map(point => ({
            // Use month + (day/31) to position points within the month
            x: point.month + (point.day || 15) / 31,
            y: point.rate
          })),
          borderColor: yearColors[(colorIndex + idx) % yearColors.length],
          fill: false,
          borderWidth: 2
        };
      });
    }
    
    // Charts: isolate failures so summary/latest panels still render (e.g. empty datasets).
    try {
      const electricityDatasets = createDatasets(chartData.electricity || {}, 0);
      const electricityChart = new Chart(document.getElementById("electricityChart"), {
        type: "line",
        data: { datasets: electricityDatasets },
        options: createChartOptions("kWh/Day"),
      });
      chartInstances.push(electricityChart);
    } catch (e) {
      console.error("Electricity chart failed:", e);
    }

    try {
      const waterDatasets = createDatasets(chartData.water || {}, 1);
      const waterChart = new Chart(document.getElementById("waterChart"), {
        type: "line",
        data: { datasets: waterDatasets },
        options: createChartOptions("m³/Day"),
      });
      chartInstances.push(waterChart);
    } catch (e) {
      console.error("Water chart failed:", e);
    }

    try {
      const fuelDatasets = createDatasets(chartData.fuel || {}, 2);
      const fuelChart = new Chart(document.getElementById("fuelChart"), {
        type: "line",
        data: { datasets: fuelDatasets },
        options: createChartOptions("Liters/Day"),
      });
      chartInstances.push(fuelChart);
    } catch (e) {
      console.error("Fuel chart failed:", e);
    }

    // Fuel heating period (Sept–June) projection
    const proj = chartData.fuel_heating_projection;
    if (proj) {
      let projHtml = '<h3>Heating period (Sept–June) – fuel projection</h3>';
      projHtml += `<p><strong>Current period:</strong> ${proj.period_label} (Sept ${new Date(proj.period_start).getFullYear()} – June ${new Date(proj.period_end).getFullYear()})</p>`;
      projHtml += `<p><strong>Consumed so far:</strong> ${formatNumber(proj.consumed_so_far)} L</p>`;
      if (proj.has_projection && proj.historical_periods_used > 0) {
        projHtml += `<p><strong>Historical average</strong> (${proj.historical_periods_used} past period(s)): ${formatNumber(proj.historical_avg_total)} L per heating period</p>`;
        projHtml += `<p><strong>Projected total this period:</strong> ${formatNumber(proj.projected_total)} L`;
        if (proj.remaining_months > 0) {
          projHtml += ` (${formatNumber(proj.remaining_months)} months remaining, extrapolated from average)`;
        }
        projHtml += '</p>';
      } else {
        projHtml += '<p><em>No complete past heating periods with fuel data yet — projection will appear when you have at least one full Sept–June period.</em></p>';
      }
      document.getElementById("fuelHeatingProjection").innerHTML = projHtml;
    } else {
      document.getElementById("fuelHeatingProjection").innerHTML = '';
    }

    // Electricity latest data (5 latest entries)
    if (chartData.latest_electricity && chartData.latest_electricity.length > 0) {
      let html = '<h3>Latest 5 Data Points:</h3>';
      chartData.latest_electricity.forEach((point, index) => {
        const dateStr = formatDate(point.date);
        const dayValueStr = formatNumber(point.day_value);
        const nightValueStr = formatNumber(point.night_value);
        const dayDailyStr = formatNumber(point.day_daily_consumption);
        const nightDailyStr = formatNumber(point.night_daily_consumption);
        html += `<div class="entry-card entry-card--electricity">
          <strong>${index + 1}. Date:</strong> ${dateStr}<br>
          <strong>Day Reading:</strong> ${dayValueStr} kWh | <strong>Daily:</strong> ${dayDailyStr} kWh/day<br>
          <strong>Night Reading:</strong> ${nightValueStr} kWh | <strong>Daily:</strong> ${nightDailyStr} kWh/day
        </div>`;
      });
      document.getElementById("electricityLatest").innerHTML = html;
    }

    // Electricity summary: up to 3 rolling 12-month periods (only with available data)
    const elecSummary = chartData.electricity_year_summary;
    const elecReadingCount = (chartData.entries || []).filter(e => e.category === 'electricity').length;
    if (elecSummary && Array.isArray(elecSummary.past_years) && elecSummary.past_years.length > 0) {
      let html = '<h3>Electricity – consumption summary (up to 3 years)</h3>';
      elecSummary.past_years.forEach((period, index) => {
        const periodStartStr = formatDate(period.period_start);
        const periodEndStr = formatDate(period.period_end);
        const periodLabel = index === 0 ? 'Last 12 months' : `Previous ${index} year${index > 1 ? 's' : ''}`;
        html += `<p><strong>${periodLabel}</strong> (${periodStartStr} → ${periodEndStr}): <strong>${formatNumber(period.total)} kWh</strong></p>`;
        html += `<p class="text-indent">Day: ${formatNumber(period.day)} kWh &nbsp;|&nbsp; Night: ${formatNumber(period.night)} kWh</p>`;
      });
      document.getElementById("electricityHeatingProjection").innerHTML = html;
    } else if (elecReadingCount < 2) {
      document.getElementById("electricityHeatingProjection").innerHTML =
        '<h3>Electricity – consumption summary (up to 3 years)</h3><p>Add at least two electricity meter readings to see yearly consumption.</p>';
    } else {
      document.getElementById("electricityHeatingProjection").innerHTML = '';
    }

    // Water latest data (5 latest entries)
    if (chartData.latest_water && chartData.latest_water.length > 0) {
      let html = '<h3>Latest 5 Data Points:</h3>';
      chartData.latest_water.forEach((point, index) => {
        const dateStr = formatDate(point.date);
        const valueStr = formatNumber(point.value);
        const dailyStr = formatNumber(point.daily_consumption);
        html += `<div class="entry-card entry-card--water">
          <strong>${index + 1}. Date:</strong> ${dateStr}<br>
          <strong>Reading:</strong> ${valueStr} m³<br>
          <strong>Daily Consumption:</strong> ${dailyStr} m³/day
        </div>`;
      });
      document.getElementById("waterLatest").innerHTML = html;
    }

    // Water summary: up to 3 rolling 12-month periods (only with available data)
    const waterSummary = chartData.water_year_summary;
    const waterReadingCount = (chartData.entries || []).filter(e => e.category === 'water').length;
    if (waterSummary && Array.isArray(waterSummary.past_years) && waterSummary.past_years.length > 0) {
      let html = '<h3>Water – consumption summary (up to 3 years)</h3>';
      waterSummary.past_years.forEach((period, index) => {
        const periodStartStr = formatDate(period.period_start);
        const periodEndStr = formatDate(period.period_end);
        const periodLabel = index === 0 ? 'Last 12 months' : `Previous ${index} year${index > 1 ? 's' : ''}`;
        html += `<p><strong>${periodLabel}</strong> (${periodStartStr} → ${periodEndStr}): <strong>${formatNumber(period.total)} m³</strong></p>`;
      });
      document.getElementById("waterYearSummary").innerHTML = html;
    } else if (waterReadingCount < 2) {
      document.getElementById("waterYearSummary").innerHTML =
        '<h3>Water – consumption summary (up to 3 years)</h3><p>Add at least two water meter readings to see yearly consumption.</p>';
    } else {
      document.getElementById("waterYearSummary").innerHTML = '';
    }

    // Fuel latest data (5 latest entries)
    if (chartData.latest_fuel && chartData.latest_fuel.length > 0) {
      let html = '<h3>Latest 5 Data Points:</h3>';
      chartData.latest_fuel.forEach((point, index) => {
        const dateStr = formatDate(point.date);
        const valueStr = formatNumber(point.value);
        const dailyStr = formatNumber(point.daily_consumption);
        html += `<div class="entry-card entry-card--fuel">
          <strong>${index + 1}. Date:</strong> ${dateStr}<br>
          <strong>Reading:</strong> ${valueStr} L<br>
          <strong>Daily Consumption:</strong> ${dailyStr} L/day
        </div>`;
      });
      document.getElementById("fuelLatest").innerHTML = html;
    }

    // Display last 10 entries in form tab
    function displayLast10Entries() {
      const entries = chartData.last_10_entries || [];
      const container = document.getElementById("last10Entries");
      
      if (entries.length === 0) {
        container.innerHTML = '<p class="text-muted">No entries recorded yet.</p>';
        return;
      }

      let html = '<div class="entry-list">';
      entries.forEach((entry, index) => {
        const dateStr = formatDate(entry.date);
        let categoryColor = '#999';
        let categoryClass = '';
        let categoryLabel = entry.category.charAt(0).toUpperCase() + entry.category.slice(1);
        let details = '';
        
        if (entry.category === 'water') {
          categoryColor = '#36A2EB';
          categoryClass = 'entry-card--water';
          details = `Water: ${formatNumber(entry.water)} m³`;
        } else if (entry.category === 'electricity') {
          categoryColor = '#FFCE56';
          categoryClass = 'entry-card--electricity';
          details = `Day: ${formatNumber(entry.electricity_day)} kWh, Night: ${formatNumber(entry.electricity_night)} kWh`;
        } else if (entry.category === 'fuel') {
          categoryColor = '#E74C3C';
          categoryClass = 'entry-card--fuel';
          details = `Gasoline: ${formatNumber(entry.gasoline)} L`;
        }

        html += `<div class="entry-list-item ${categoryClass}" style="border-left-color: ${categoryColor};">
          <div style="flex: 1;">
            <strong class="entry-list-item__category" style="color: ${categoryColor};">${categoryLabel}</strong> - ${dateStr}<br>
            <span class="entry-list-item__details">${details}</span>
          </div>
          <form method="POST" action="/delete" style="margin: 0; display: inline-block;" onsubmit="return confirm('Are you sure you want to delete this entry?');">
            <input type="hidden" name="index" value="${index}">
            <button type="submit" class="btn-delete">Delete</button>
          </form>
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Call on page load
    displayLast10Entries();

  </script>
  
  
</body>
</html>
